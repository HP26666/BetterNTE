[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betternte"
version = "0.3.0"
description = "BetterNTE - 异环（Neverness to Everness）自动化辅助工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "mss>=10.0.0",
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "pydirectinput>=1.0.4",
]

[project.scripts]
betternte = "betternte.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
