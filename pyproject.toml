[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishpp"
version = "0.2.0"
description = "Pure vision fishing assistant with a PySide6 configuration UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "mss>=10.0.0",
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "pydirectinput>=1.0.4",
]

[project.scripts]
fishpp = "fishpp.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
